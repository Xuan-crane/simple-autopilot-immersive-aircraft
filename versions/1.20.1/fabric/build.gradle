plugins { id 'java-library'; id 'fabric-loom' version '1.9.2' }
group = 'dev.xuancrane'
version = '1.3.0'
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
base.archivesName = 'simple-autopilot-immersive-aircraft-1.20.1-fabric'
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
    modImplementation 'maven.modrinth:immersive-aircraft:dNHanmFP'
}
loom { mixin { defaultRefmapName = 'aircraft_autoforward.refmap.json' } }
tasks.named('jar', Jar) { manifest.attributes('Implementation-Version': project.version) }
