plugins { id 'java-library'; id 'net.neoforged.moddev.legacyforge' version '2.0.148' }
group = 'dev.xuancrane'
version = '1.4.0'
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
base.archivesName = 'simple-autopilot-immersive-aircraft-1.20.1-forge'
legacyForge {
    enable { forgeVersion = '1.20.1-47.3.0'; disableRecompilation = true }
    mods { aircraft_autoforward { sourceSet sourceSets.main } }
}
dependencies { modImplementation 'maven.modrinth:immersive-aircraft:aDUlOdzA' }
tasks.named('jar', Jar) { manifest.attributes('Implementation-Version': project.version, 'MixinConfigs': 'aircraft_autoforward.mixins.json') }

// Optional external build directory keeps large generated artifacts off the source drive.
if (providers.gradleProperty('autopilotBuildDir').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('autopilotBuildDir').get())
}
