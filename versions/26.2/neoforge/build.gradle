plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group = 'dev.xuancrane'
version = '1.4.0'
base.archivesName = 'simple-autopilot-immersive-aircraft-26.2-neoforge'
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
neoForge { enable { version = '26.2.0.88'; disableRecompilation = true }; mods { aircraft_autoforward { sourceSet sourceSets.main } } }
dependencies { implementation 'maven.modrinth:immersive-aircraft:QbWk19ut'; testImplementation platform('org.junit:junit-bom:5.11.4'); testImplementation 'org.junit.jupiter:junit-jupiter'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher'; testImplementation 'org.ow2.asm:asm-tree:9.9.1' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { manifest.attributes('Implementation-Version': project.version); from('LICENSE') { rename { 'LICENSE_simple_autopilot' } } }

// Optional external build directory keeps large generated artifacts off the source drive.
if (providers.gradleProperty('autopilotBuildDir').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('autopilotBuildDir').get())
}

tasks.named('test', Test) { systemProperty 'autopilot.loader', 'neoforge' }

// Inspect actual Minecraft and loader bytecode without initializing their client classes.
tasks.named('test', Test) { classpath += sourceSets.main.compileClasspath }
