plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}
group = 'dev.xuancrane'
version = '1.4.0'
base.archivesName = 'simple-autopilot-immersive-aircraft-1.21.1-fabric'
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.1+1.21.1'
    modImplementation 'maven.modrinth:immersive-aircraft:Ib1HyDOQ'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { manifest.attributes('Implementation-Version': project.version); from('LICENSE') { rename { 'LICENSE_simple_autopilot' } } }

configurations {
    aircraftCompatibilityBaseline { transitive = false }
    aircraftCompatibilityCurrent { transitive = false }
}
dependencies {
    aircraftCompatibilityBaseline 'maven.modrinth:immersive-aircraft:KLXjQEDg'
    aircraftCompatibilityCurrent 'maven.modrinth:immersive-aircraft:Ib1HyDOQ'
}
tasks.named('test', Test) {
    systemProperty 'upstream.low', configurations.aircraftCompatibilityBaseline.singleFile.absolutePath
    systemProperty 'upstream.current', configurations.aircraftCompatibilityCurrent.singleFile.absolutePath
}

// Optional external build directory keeps large generated artifacts off the source drive.
if (providers.gradleProperty('autopilotBuildDir').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('autopilotBuildDir').get())
}
