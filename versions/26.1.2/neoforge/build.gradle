plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group = 'dev.xuancrane'
version = '1.3.0'
base.archivesName = 'simple-autopilot-immersive-aircraft-26.1.2-neoforge'
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
neoForge { enable { version = '26.1.2.112'; disableRecompilation = true }; mods { aircraft_autoforward { sourceSet sourceSets.main } } }
dependencies { implementation 'maven.modrinth:immersive-aircraft:ePOUdUBX'; testImplementation platform('org.junit:junit-bom:5.11.4'); testImplementation 'org.junit.jupiter:junit-jupiter'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher'; testImplementation 'org.ow2.asm:asm-tree:9.9.1' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { manifest.attributes('Implementation-Version': project.version); from('LICENSE') { rename { 'LICENSE_simple_autopilot' } } }
