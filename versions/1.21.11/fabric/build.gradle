plugins { id 'fabric-loom' version '1.14.10'; id 'maven-publish' }
group = 'dev.xuancrane'
version = '1.3.0'
base.archivesName = 'simple-autopilot-immersive-aircraft-1.21.11-fabric'
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    modImplementation 'maven.modrinth:immersive-aircraft:toZOkd46'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
}
sourceSets.main.resources.exclude 'META-INF/neoforge.mods.toml'
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { manifest.attributes('Implementation-Version': project.version) }

configurations {
    aircraftCompatibilityBaseline { transitive = false }
    aircraftCompatibilityCurrent { transitive = false }
}
dependencies {
    aircraftCompatibilityBaseline 'maven.modrinth:immersive-aircraft:udXItLW7'
    aircraftCompatibilityCurrent 'maven.modrinth:immersive-aircraft:toZOkd46'
}
tasks.named('test', Test) {
    systemProperty 'upstream.low', configurations.aircraftCompatibilityBaseline.singleFile.absolutePath
    systemProperty 'upstream.current', configurations.aircraftCompatibilityCurrent.singleFile.absolutePath
}
